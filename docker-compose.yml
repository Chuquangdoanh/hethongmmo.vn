services:
  postgres:
    image: postgres:16-alpine
    container_name: hethongmmo-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hethongmmo}
    # PostgreSQL tuning cho VPS 2 CPU / 4 GB RAM
    command: >
      postgres
      -c shared_buffers=768MB
      -c effective_cache_size=2560MB
      -c work_mem=4MB
      -c maintenance_work_mem=256MB
      -c max_connections=50
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c checkpoint_timeout=10min
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c log_min_duration_statement=1000
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-hethongmmo}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1024m
          cpus: "1.0"
        reservations:
          memory: 256m

  redis:
    image: redis:7-alpine
    container_name: hethongmmo-redis
    restart: unless-stopped
    # Tắt RDB persistence (rate-limit data không cần persist, giảm I/O spike)
    command: redis-server --requirepass ${REDIS_PASSWORD} --save "" --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
        reservations:
          memory: 64m

  pgbouncer:
    image: bitnami/pgbouncer:1.23.1
    container_name: hethongmmo-pgbouncer
    restart: unless-stopped
    environment:
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USERNAME: ${POSTGRES_USER:-app_user}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRESQL_DATABASE: ${POSTGRES_DB:-hethongmmo}
      PGBOUNCER_DATABASE: ${POSTGRES_DB:-hethongmmo}
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 200
      PGBOUNCER_DEFAULT_POOL_SIZE: 25
      PGBOUNCER_MIN_POOL_SIZE: 5
      PGBOUNCER_RESERVE_POOL_SIZE: 5
      PGBOUNCER_AUTH_TYPE: scram-sha-256
      PGBOUNCER_SERVER_IDLE_TIMEOUT: 600
      PGBOUNCER_IGNORE_STARTUP_PARAMETERS: extra_float_digits,application_name
      # transaction mode: bắt buộc reset session sau mỗi transaction
      PGBOUNCER_SERVER_RESET_QUERY: DISCARD ALL
      PGBOUNCER_MAX_PREPARED_STATEMENTS: 100
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"
        reservations:
          memory: 32m

  web:
    image: ${REGISTRY_URL:-local}/hethongmmo:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: hethongmmo-web
    restart: unless-stopped
    stop_grace_period: 35s
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-hethongmmo}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      UPLOAD_DIR: /uploads
      DB_POOL_SIZE: "10"
      CLUSTER_WORKERS: ""
    volumes:
      - ./uploads:/uploads
    # Không expose port 3000 ra host — chỉ Nginx mới được proxy vào
    expose:
      - "3000"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1280m
          cpus: "1.5"
        reservations:
          memory: 384m

  nginx:
    # macbre/nginx-brotli: nginx mainline + Brotli module compiled in
    image: macbre/nginx-brotli:latest
    container_name: hethongmmo-nginx
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_cache:/var/cache/nginx/proxy
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.5"
        reservations:
          memory: 32m

  backup:
    image: postgres:16-alpine
    container_name: hethongmmo-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-app_user}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-hethongmmo}
    volumes:
      - ./backups:/backups
    entrypoint: ["sh", "-c"]
    command: >-
      mkdir -p /backups && while true; do
      FNAME="backup_$(date +%Y%m%d_%H%M%S).sql.gz" &&
      pg_dump | gzip > "/backups/$FNAME" &&
      echo "[backup] Completed: $FNAME ($(du -sh /backups/$FNAME | cut -f1))" &&
      find /backups -name '*.sql.gz' -mtime +7 -delete;
      sleep 86400; done
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"

  # Monitoring — chỉ bind localhost, access qua SSH tunnel: ssh -L 19999:localhost:19999 user@vps
  netdata:
    image: netdata/netdata:stable
    container_name: hethongmmo-netdata
    hostname: hethongmmo-vps
    restart: unless-stopped
    pid: host
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    environment:
      NETDATA_CLAIM_TOKEN: ""
      NETDATA_CLAIM_URL: ""
    volumes:
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:19999:19999"
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

volumes:
  pg_data:
  redis_data:
  nginx_cache:
  netdataconfig:
  netdatalib:
  netdatacache:
