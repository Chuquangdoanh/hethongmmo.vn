services:
  postgres:
    image: postgres:16-alpine
    container_name: hethongmmo-pg
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hethongmmo}
    # PostgreSQL tuning cho VPS 2 CPU / 4 GB RAM
    command: >
      postgres
      -c shared_buffers=768MB
      -c effective_cache_size=2560MB
      -c work_mem=4MB
      -c maintenance_work_mem=256MB
      -c max_connections=50
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c checkpoint_timeout=10min
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c log_min_duration_statement=1000
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-hethongmmo}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1024m
          cpus: "1.0"
        reservations:
          memory: 256m

  redis:
    image: redis:7-alpine
    container_name: hethongmmo-redis
    restart: unless-stopped
    # Tắt RDB persistence (rate-limit data không cần persist, giảm I/O spike)
    command: redis-server --requirepass ${REDIS_PASSWORD} --save "" --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
        reservations:
          memory: 64m

  migrate:
    image: ${REGISTRY_URL:-ghcr.io/chuquangdoanh}/hethongmmo-migrate:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    container_name: hethongmmo-migrate
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hethongmmo}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    image: ${REGISTRY_URL:-ghcr.io/chuquangdoanh}/hethongmmo:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: hethongmmo-web
    restart: unless-stopped
    stop_grace_period: 35s
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hethongmmo}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      UPLOAD_DIR: /uploads
      DB_POOL_SIZE: "10"
    volumes:
      - ./uploads:/uploads
      - nextjs_cache:/app/.next/cache   # unstable_cache survive container restart
    # Không expose port 3000 ra host — chỉ Nginx mới được proxy vào
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health 2>/dev/null | grep -q 'status'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1280m
          cpus: "1.5"
        reservations:
          memory: 384m

  nginx:
    # macbre/nginx-brotli: nginx mainline + Brotli module compiled in
    image: macbre/nginx-brotli:latest
    container_name: hethongmmo-nginx
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_cache:/var/cache/nginx/proxy
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
    healthcheck:
      test: ["CMD-SHELL", "pgrep nginx > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.5"
        reservations:
          memory: 32m

  warmup:
    image: alpine:3.20
    container_name: hethongmmo-warmup
    restart: unless-stopped
    depends_on:
      - web
    # Ping các trang public chính mỗi 3 phút để giữ Nginx + CF cache luôn ấm
    # User truy cập lần đầu sẽ luôn nhận cache thay vì chờ Next.js render
    command: >
      sh -c "
        apk add --no-cache curl --quiet &&
        while true; do
          curl -sf http://nginx/kho-tai-nguyen     -o /dev/null -H 'Host: hethongmmo.vn' &
          curl -sf http://nginx/tai-nguyen-mmo     -o /dev/null -H 'Host: hethongmmo.vn' &
          curl -sf http://nginx/                   -o /dev/null -H 'Host: hethongmmo.vn' &
          curl -sf http://nginx/dich-vu            -o /dev/null -H 'Host: hethongmmo.vn' &
          wait
          sleep 180
        done
      "
    deploy:
      resources:
        limits:
          memory: 32m
          cpus: "0.05"

  backup:
    # alpine:3.20 — script tự cài postgresql-client + rclone khi khởi động
    image: alpine:3.20
    container_name: hethongmmo-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # ── PostgreSQL ──────────────────────────────────────────────────────────
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-app_user}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-hethongmmo}

      # ── Offsite: Cloudflare R2 (bucket riêng, credentials riêng với media R2) ──
      BACKUP_R2_BUCKET: ${BACKUP_R2_BUCKET:-hethongmmo-backups}

      # rclone đọc config từ env vars — dùng BACKUP_R2_* thay vì R2_* của media
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${BACKUP_R2_ACCESS_KEY_ID}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${BACKUP_R2_SECRET_ACCESS_KEY}
      RCLONE_CONFIG_R2_ENDPOINT: ${BACKUP_R2_ENDPOINT}
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
    volumes:
      - ./backups:/backups               # local backup storage
      - ./uploads:/uploads:ro            # user-uploaded files (read-only)
      - ./infra/nginx/ssl:/ssl:ro        # SSL certificates
      - ./infra/backup/backup.sh:/backup.sh:ro
    command: sh /backup.sh
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"

  # Monitoring — chỉ bind localhost, access qua SSH tunnel: ssh -L 19999:localhost:19999 user@vps
  # Hardened: bỏ docker.sock, SYS_PTRACE, SYS_ADMIN, apparmor:unconfined
  # Đánh đổi: mất per-container disk chart và eBPF metrics — CPU/RAM/network vẫn đầy đủ
  netdata:
    image: netdata/netdata:stable
    container_name: hethongmmo-netdata
    hostname: hethongmmo-vps
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      NETDATA_CLAIM_TOKEN: ""
      NETDATA_CLAIM_URL: ""
    volumes:
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
    ports:
      - "127.0.0.1:19999:19999"
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

volumes:
  pg_data:
  redis_data:
  nginx_cache:
  nextjs_cache:
  netdataconfig:
  netdatalib:
  netdatacache:
