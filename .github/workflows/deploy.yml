name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Phát hiện file nào thay đổi
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'web/**'
              - 'Dockerfile'

  # Build image — chỉ chạy khi web/ hoặc Dockerfile thay đổi
  build:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runner
          push: true
          tags: ghcr.io/chuquangdoanh/hethongmmo:latest
          build-args: |
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: migrator
          push: true
          tags: ghcr.io/chuquangdoanh/hethongmmo-migrate:latest
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

  # Deploy — luôn chạy, nhưng chỉ pull image khi app thay đổi
  deploy:
    needs: [changes, build]
    if: always() && !failure() && !cancelled()
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          source: "docker-compose.yml,infra/"
          target: "/opt/hethongmmo"

      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 20m
          script: |
            set -e
            cd /opt/hethongmmo

            # Pull + restart app chỉ khi có image mới
            if [ "${{ needs.changes.outputs.app }}" = "true" ]; then
              echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ghcr.io \
                -u "${{ secrets.REGISTRY_USER }}" --password-stdin
              docker compose pull
              docker compose up -d
              docker image prune -f
              echo "🐳 App image updated"
            else
              echo "⏭️  App không đổi — skip pull"
            fi

            # Luôn reload nginx để áp dụng config mới
            docker exec hethongmmo-nginx nginx -s reload || true

            echo "✅ Deploy xong: $(date)"
