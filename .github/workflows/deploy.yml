name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Phát hiện file nào thay đổi
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      prisma: ${{ steps.filter.outputs.prisma }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'web/**'
              - 'Dockerfile'
            prisma:
              - 'web/prisma/**'
              - 'Dockerfile'
            infra:
              - 'infra/**'
              - 'docker-compose.yml'

  # Typecheck + unit/integration tests — chạy trước khi build Docker
  # Tất cả tests đều mock prisma → không cần database
  test:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    name: Type check & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Type check
        run: node node_modules/typescript/bin/tsc --noEmit

      - name: Run tests
        run: pnpm test

  # Build web image — chỉ khi tests pass VÀ web/** hoặc Dockerfile thay đổi
  build-web:
    needs: [changes, test]
    if: needs.changes.outputs.app == 'true'
    name: Build & Push web image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runner
          push: true
          tags: ghcr.io/chuquangdoanh/hethongmmo:latest
          build-args: |
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY || '0x4AAAAAADdtPd4eBWk-jqZ6' }}
          # mode=max: export tất cả layers kể cả cache mounts (pnpm store + .next/cache)
          # → lần build sau dùng lại, next build chỉ compile phần thay đổi (~1-2 min)
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # Build migrator — CHỈ khi prisma schema hoặc Dockerfile thay đổi
  # Code-only push → skip hoàn toàn, tiết kiệm 1-2 phút
  build-migrator:
    needs: [changes, test]
    if: needs.changes.outputs.prisma == 'true'
    name: Build & Push migrator image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: migrator
          push: true
          tags: ghcr.io/chuquangdoanh/hethongmmo-migrate:latest
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

  # Deploy — chạy sau cả 2 build jobs (dù 1 trong 2 bị skip cũng không sao)
  # Điều kiện tường minh: chạy khi app, prisma, HOẶC infra thay đổi VÀ không có build nào fail
  # infra thay đổi (nginx.conf, docker-compose.yml): chỉ cần SCP + nginx reload, không rebuild image
  deploy:
    needs: [changes, build-web, build-migrator]
    if: >-
      always() &&
      !cancelled() &&
      (needs.build-web.result == 'success' || needs.build-web.result == 'skipped') &&
      (needs.build-migrator.result == 'success' || needs.build-migrator.result == 'skipped') &&
      (needs.changes.outputs.app == 'true' || needs.changes.outputs.prisma == 'true' || needs.changes.outputs.infra == 'true')
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          source: "docker-compose.yml,infra/"
          target: "/opt/hethongmmo"

      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 20m
          script: |
            set -e
            cd /opt/hethongmmo

            # Pull + restart app chỉ khi có image mới
            if [ "${{ needs.changes.outputs.app }}" = "true" ]; then
              echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ghcr.io \
                -u "${{ secrets.REGISTRY_USER }}" --password-stdin
              docker compose pull
              docker compose up -d
              docker image prune -f
              echo "🐳 App image updated"

              # Chờ container healthy
              # start_period=60s + interval=30s × retries=3 = cần ~150s tối thiểu
              echo "⏳ Chờ container healthy..."
              ELAPSED=0
              until docker inspect --format='{{.State.Health.Status}}' hethongmmo-web 2>/dev/null | grep -q '^healthy$'; do
                if [ "$ELAPSED" -ge 240 ]; then
                  echo "❌ Timeout: container không healthy sau 240s"
                  echo "--- Trạng thái tất cả containers ---"
                  docker ps -a --filter "name=hethongmmo" --format "table {{.Names}}\t{{.Status}}\t{{.State}}"
                  if docker inspect hethongmmo-web > /dev/null 2>&1; then
                    echo "--- Web logs (50 dòng cuối) ---"
                    docker logs hethongmmo-web --tail 50
                  else
                    echo "⚠️  hethongmmo-web không tồn tại — có thể migrate thất bại"
                    echo "--- Migrate logs ---"
                    docker logs hethongmmo-migrate --tail 30 2>/dev/null || echo "(không có migrate logs)"
                  fi
                  exit 1
                fi
                sleep 10
                ELAPSED=$((ELAPSED + 10))
              done
              echo "✅ Container healthy sau ${ELAPSED}s"

              # Smoke test qua 127.0.0.1 → nginx → Next.js (bypass Cloudflare)
              echo "🔍 Smoke test..."

              # Helper: fail nếu endpoint trả 503 hoặc 429 (rate limit / down)
              # Dùng HTTPS (-k bỏ qua lỗi cert localhost) vì nginx redirect HTTP→HTTPS (301).
              # KHÔNG dùng tên biến PATH — shadow $PATH khiến curl không tìm được
              check() {
                local URLPATH="$1" EXPECT="$2"
                local STATUS
                STATUS=$(curl -s -k -o /dev/null -w "%{http_code}" --max-time 5 "https://127.0.0.1${URLPATH}")
                if [ "$STATUS" = "503" ] || [ "$STATUS" = "429" ]; then
                  echo "❌ ${URLPATH} → $STATUS (rate limit / service down)"
                  return 1
                fi
                if [ -n "$EXPECT" ] && [ "$STATUS" != "$EXPECT" ]; then
                  echo "❌ ${URLPATH} → $STATUS (expected $EXPECT)"
                  return 1
                fi
                echo "✅ ${URLPATH} → $STATUS"
              }

              # Health check
              check /api/health 200

              # Public pages
              check / ""
              check /dang-nhap ""
              check /dang-ky ""

              # Protected API — phải trả 401 (không phải 503/429)
              check /api/user/profile ""
              check /api/orders ""
              check /api/seller/register ""

              # Public API pages
              check /thong-tin-ca-nhan ""
              check /don-hang ""
              check /lich-su-giao-dich ""
              check /nap-tien ""
              check /tro-chuyen ""

              echo "🎉 Smoke test passed"
            else
              echo "⏭️  App không đổi — skip pull"
            fi

            # Reload nginx để áp dụng config mới (infra/ đã được SCP ở bước trên)
            echo "=== nginx.conf frame-src hiện tại trên server ==="
            grep "frame-src" /opt/hethongmmo/infra/nginx/nginx.conf || echo "(không tìm thấy frame-src)"
            docker exec hethongmmo-nginx nginx -t
            docker exec hethongmmo-nginx nginx -s reload
            echo "✅ Nginx reloaded: $(date)"

            echo "✅ Deploy xong: $(date)"
