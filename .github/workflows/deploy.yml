name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:  # Cho phép chạy thủ công trên GitHub Actions

jobs:
  build:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runner
          push: true
          tags: ghcr.io/chuquangdoanh/hethongmmo:latest
          build-args: |
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: migrator
          push: true
          tags: ghcr.io/chuquangdoanh/hethongmmo-migrate:latest
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [build]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          source: "docker-compose.yml,infra/"
          target: "/opt/hethongmmo"

      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 20m
          script: |
            set -e
            cd /opt/hethongmmo

            # Login GHCR để pull image
            echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ghcr.io \
              -u "${{ secrets.REGISTRY_USER }}" --password-stdin

            # Pull images mới
            docker compose pull web migrate

            # Chạy migration
            docker compose run --rm migrate

            # Restart web (zero-downtime)
            docker compose up -d --no-deps --wait web

            # Dọn image cũ
            docker image prune -f

            echo "✅ Deploy xong: $(date)"
