name: CI

on:
  push:
    branches: ["main", "develop", "feature/**", "fix/**"]
  pull_request:
    branches: ["main", "develop"]

defaults:
  run:
    working-directory: web

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

  typecheck:
    name: TypeScript check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm prisma generate
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_db"

      - name: Generate next-env.d.ts
        run: printf '/// <reference types="next" />\n/// <reference types="next/image-types/global" />\n' > next-env.d.ts

      - name: TypeScript strict check
        run: pnpm typecheck

  test:
    name: Unit & Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENCRYPTION_KEY: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2"
      AUTH_SECRET: "ci-auth-secret-32-bytes-minimum!!"
      SEPAY_WEBHOOK_SECRET: "ci-sepay-secret"
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_db"
      REDIS_URL: "redis://localhost:6379"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm prisma generate

      - name: Prisma migrate
        run: pnpm prisma migrate deploy

      - name: Run tests
        run: pnpm test

  docker:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    needs: [lint, test]
    # Chỉ build image khi push lên main (không build cho PR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # packages:write cho phép GITHUB_TOKEN push lên ghcr.io
    # KHÔNG thêm environment ở đây — environment:production sẽ restrict GITHUB_TOKEN
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: "."
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lowercase registry owner
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push web (runner)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runner
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.value }}/hethongmmo:latest
          build-args: |
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          cache-from: type=gha,scope=buildcache-v2
          cache-to: type=gha,mode=max,scope=buildcache-v2

      - name: Build and push migrator
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: migrator
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.value }}/hethongmmo-migrate:latest
          cache-from: type=gha,scope=buildcache-v2
          cache-to: type=gha,mode=max,scope=buildcache-v2

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # environment:production để đọc PRODUCTION_HOST và DEPLOY_SSH_KEY
    # Tách riêng với docker job để GITHUB_TOKEN của docker job không bị restrict
    environment: production
    steps:
      - name: Validate secrets
        run: |
          [ -n "$HOST" ] && echo "PRODUCTION_HOST: set" || { echo "PRODUCTION_HOST: EMPTY ❌"; exit 1; }
          [ -n "$KEY" ]  && echo "DEPLOY_SSH_KEY: set"  || { echo "DEPLOY_SSH_KEY: EMPTY ❌";  exit 1; }
        env:
          HOST: ${{ secrets.PRODUCTION_HOST }}
          KEY:  ${{ secrets.DEPLOY_SSH_KEY }}

      - name: SSH deploy (zero-downtime rolling update)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 20m
          script: |
            set -e
            whoami
            cd /opt/hethongmmo

            # Cập nhật source (docker-compose.yml, nginx.conf, scripts, v.v.)
            git pull origin main

            # Đăng nhập registry để pull image mới (dùng PAT — GITHUB_TOKEN không hoạt động trên VPS)
            echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ghcr.io -u "${{ secrets.REGISTRY_USER }}" --password-stdin

            # Pull image mới (web + migrator)
            docker compose pull web migrate

            # Chạy migration trước (migrate service dùng migrator image có full node_modules)
            docker compose run --rm migrate

            # Rolling update: khởi container mới trước → đợi healthcheck OK → old container down
            # --no-deps: không restart postgres/redis/nginx
            # --wait: đợi healthcheck pass (start_period 60s + 3 retries × 30s = tối đa 150s)
            docker compose up -d --no-deps --wait web

            # Dọn image cũ (giữ 2 bản gần nhất)
            docker image prune -f
