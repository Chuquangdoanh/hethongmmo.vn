name: Deploy — Staging

on:
  push:
    branches: ["develop"]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      # ── Build & push Docker image ────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.REGISTRY_URL }}/hethongmmo:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

      # ── Deploy to staging server ─────────────────────────────────────
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/hethongmmo-staging
            export IMAGE_TAG=staging-${{ github.sha }}
            export REGISTRY_URL=${{ secrets.REGISTRY_URL }}

            # Pull new image
            docker pull ${REGISTRY_URL}/hethongmmo:${IMAGE_TAG}

            # Update .env
            echo "IMAGE_TAG=${IMAGE_TAG}" > .env.deploy

            # Run migrations before swapping containers
            docker run --rm --env-file .env \
              ${REGISTRY_URL}/hethongmmo:${IMAGE_TAG} \
              pnpm prisma migrate deploy

            # Swap containers
            docker compose pull
            docker compose up -d --no-build web

            # Wait for health check
            for i in $(seq 1 12); do
              if curl -sf http://localhost:3000/api/health > /dev/null; then
                echo "Health check passed"
                exit 0
              fi
              echo "Waiting... ($i/12)"
              sleep 5
            done
            echo "Health check failed after 60s"
            exit 1

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Staging deploy failed for commit ${{ github.sha }}"
