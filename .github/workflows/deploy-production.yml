name: Deploy — Production

on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-production
  cancel-in-progress: false  # Never cancel in-flight production deploy

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      # ── Build & push Docker image ────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/hethongmmo:${{ github.sha }}
            ${{ secrets.REGISTRY_URL }}/hethongmmo:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

      # ── Deploy to production server ──────────────────────────────────
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/hethongmmo

            # Record previous image tag for potential rollback
            PREV_IMAGE=$(docker inspect --format='{{.Config.Image}}' hethongmmo-web 2>/dev/null || echo "none")
            echo "Previous image: $PREV_IMAGE"
            echo "$PREV_IMAGE" > /tmp/prev-image.txt

            export IMAGE_TAG=${{ github.sha }}
            export REGISTRY_URL=${{ secrets.REGISTRY_URL }}

            # Pull new image
            docker pull ${REGISTRY_URL}/hethongmmo:${IMAGE_TAG}

            # Run DB migrations (safe — deploy only applies pending, never destructive rollback)
            docker run --rm --env-file .env \
              ${REGISTRY_URL}/hethongmmo:${IMAGE_TAG} \
              pnpm prisma migrate deploy

            # Rolling update — zero-downtime swap
            docker compose up -d --no-build --scale web=2 web
            sleep 10

            # Scale back to 1 after health check passes
            docker compose up -d --no-build --scale web=1 web

            # Health check (60s window)
            for i in $(seq 1 12); do
              if curl -sf http://localhost:3000/api/health > /dev/null; then
                echo "✓ Health check passed"
                exit 0
              fi
              echo "Waiting for health check... ($i/12)"
              sleep 5
            done

            echo "✗ Health check failed — rolling back"
            PREV=$(cat /tmp/prev-image.txt)
            if [ "$PREV" != "none" ]; then
              export IMAGE_TAG=$(echo "$PREV" | awk -F: '{print $NF}')
              docker compose up -d --no-build web
            fi
            exit 1

      - name: Tag release
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "deploy-$(date +'%Y%m%d-%H%M%S')-${GITHUB_SHA:0:7}" || true
          git push origin --tags || true

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Production deploy FAILED for commit ${{ github.sha }} — rollback attempted"
