[databases]
; Wildcard: mọi database name đều được forward đến postgres container
* = host=postgres port=5432

[pgbouncer]
listen_port             = 6432
listen_addr             = 0.0.0.0
auth_type               = scram-sha-256
auth_file               = /etc/pgbouncer/userlist.txt

; transaction mode: mỗi transaction dùng 1 server connection từ pool → throughput cao hơn
; Yêu cầu: max_prepared_statements > 0 để tương thích với node-postgres prepared statements
pool_mode               = transaction

; Cho phép prepared statements trong transaction mode (node-postgres dùng extended query protocol)
max_prepared_statements = 100

; Tối đa client connections đến PgBouncer (tất cả workers tổng cộng)
max_client_conn         = 200

; Số connections thực đến PostgreSQL (không đổi dù scale lên bao nhiêu CPU)
default_pool_size       = 25
min_pool_size           = 5
reserve_pool_size       = 5
reserve_pool_timeout    = 3

; Đóng server connection sau 10 phút không dùng
server_idle_timeout     = 600
client_idle_timeout     = 600

; Không log connection/disconnection để giảm I/O
log_connections         = 0
log_disconnections      = 0
log_pooler_errors       = 1

; Bỏ qua các startup parameters mà Next.js/Prisma gửi nhưng PgBouncer không hiểu
ignore_startup_parameters = extra_float_digits,application_name
