user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging (buffered để giảm I/O) ───────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main buffer=16k flush=5s;

    # ── Performance ───────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;

    # ── Timeouts ──────────────────────────────────────────────────────
    client_max_body_size    10m;
    client_body_timeout     30s;
    client_header_timeout   10s;
    keepalive_timeout       65s;
    keepalive_requests      1000;
    send_timeout            30s;

    # ── Buffers ───────────────────────────────────────────────────────
    client_body_buffer_size     128k;
    client_header_buffer_size   1k;
    large_client_header_buffers 4 8k;
    proxy_buffer_size           16k;
    proxy_buffers               4 32k;
    proxy_busy_buffers_size     64k;

    # ── Open file cache ───────────────────────────────────────────────
    open_file_cache          max=2000 inactive=20s;
    open_file_cache_valid    30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    # ── Rate limiting ─────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=general:20m rate=120r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m    rate=10r/m;
    limit_req_zone $binary_remote_addr zone=webhook:10m rate=30r/m;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # ── Gzip ──────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   4;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml image/webp
               font/woff2 application/wasm;

    # ── Brotli (macbre/nginx-brotli image) ───────────────────────────
    brotli              on;
    brotli_comp_level   6;
    brotli_static       on;
    brotli_min_length   256;
    brotli_types text/plain text/css application/json application/javascript
                 text/xml application/xml image/svg+xml image/webp
                 font/woff2 application/wasm;

    # ── Proxy cache (dành cho public GET API) ────────────────────────
    # Lưu tại /var/cache/nginx/proxy (volume nginx_cache trong docker-compose)
    proxy_cache_path /var/cache/nginx/proxy
        levels=1:2
        keys_zone=api_cache:10m
        max_size=256m
        inactive=5m
        use_temp_path=off;

    # ── WebSocket upgrade map ─────────────────────────────────────────
    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ''       close;
    }

    # ── Upstream ──────────────────────────────────────────────────────
    upstream nextjs {
        server web:3000;
        keepalive 128;
        keepalive_requests 1000;
        keepalive_timeout  60s;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        # macbre/nginx-brotli dùng nginx cũ hơn — http2 phải inline với listen
        listen 443 ssl http2;
        server_name hethongmmo.vn www.hethongmmo.vn;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:20m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ── Security headers ──────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

        # Block bad bots
        if ($http_user_agent ~* (scrapy|zgrab|masscan|nikto|sqlmap)) {
            return 403;
        }

        # ── Proxy defaults (áp dụng cho mọi location) ─────────────────
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    60s;

        # ── Static assets: cache 1 năm (content hash → safe immutable) ─
        location /_next/static/ {
            proxy_pass http://nextjs;
            proxy_set_header Connection "";
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ── Optimized images: cache 7 ngày ────────────────────────────
        location /_next/image {
            proxy_pass http://nextjs;
            proxy_set_header Connection "";
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        # ── SSE Ticker: timeout dài, buffering tắt ────────────────────
        location /api/ticker {
            limit_req zone=general burst=10 nodelay;
            limit_conn conn 5;
            proxy_pass http://nextjs;
            proxy_set_header Connection "";
            proxy_read_timeout  300s;
            proxy_buffering     off;
            proxy_cache         off;
        }

        # ── Public API: proxy cache cho GET (bỏ qua nếu có cookie) ───
        # products, seller listing, tut-tricks, services — không cache user-specific data
        location ~ ^/api/(products|tut-tricks|dich-vu|courses|ticker-prices) {
            limit_req zone=general burst=40 nodelay;
            limit_conn conn 20;
            proxy_pass http://nextjs;
            proxy_set_header Connection "";

            # Nếu request có cookie (user đã đăng nhập) → bypass cache
            proxy_no_cache     $http_cookie;
            proxy_cache_bypass $http_cookie;

            proxy_cache           api_cache;
            proxy_cache_key       "$scheme$request_method$host$request_uri";
            proxy_cache_valid     200 60s;
            proxy_cache_valid     404 10s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock      on;
            proxy_cache_lock_timeout 5s;
            add_header            X-Cache-Status $upstream_cache_status always;
        }

        # ── API auth: rate limit nghiêm ───────────────────────────────
        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;
            limit_conn conn 5;
            proxy_pass http://nextjs;
            proxy_set_header Connection "";
        }

        # ── Webhook ───────────────────────────────────────────────────
        location /api/webhooks/ {
            limit_req zone=webhook burst=10 nodelay;
            proxy_pass http://nextjs;
            proxy_set_header Connection "";
        }

        # ── General ───────────────────────────────────────────────────
        location / {
            limit_req zone=general burst=40 nodelay;
            limit_conn conn 20;
            proxy_pass http://nextjs;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
